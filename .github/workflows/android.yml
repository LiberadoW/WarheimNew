name: Android APK

# The app is a Capacitor shell around the live site, so it rarely needs a new
# build: the site updates itself. Run it from the Actions tab, or it runs when
# the shell (mobile/) changes on master.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate the Android project and icons
        working-directory: mobile
        run: npm run android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Warheim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Warheim-apk
          path: Warheim.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Warheim na Androida
          make_latest: true
          files: Warheim.apk
          body: |
            Aplikacja Warheim na Androida. Otwiera stronę warheimbuilder.netlify.app, więc zawsze ma najnowszą wersję; wymaga internetu.

            Instalacja: pobierz Warheim.apk na telefonie, otwórz plik i zezwól przeglądarce na instalowanie aplikacji z nieznanych źródeł.
